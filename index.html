<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Let it go</title>
<meta name="description" content="마음속 이야기를 적어 마법사의 냄비에 흘려보내는 작은 힐링 경험." />

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Let it go" />
<meta property="og:description" content="마음속 이야기를 적어 마법사의 냄비에 흘려보내는 작은 힐링 경험." />
<meta property="og:image" content="assets/images/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Let it go" />
<meta name="twitter:description" content="마음속 이야기를 적어 마법사의 냄비에 흘려보내는 작은 힐링 경험." />
<meta name="twitter:image" content="assets/images/og-image.png" />

<!-- Favicon -->
<link rel="icon" type="image/png" href="assets/images/favicon.png" />

<link
  rel="preload"
  href="assets/fonts/DungGeunMo.woff2"
  as="font"
  type="font/woff2"
  crossorigin
/>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<section id="screen-language" class="screen-language">
  <div class="lang-choices">
    <button id="btn-lang-ko" class="btn-primary plaque-btn plaque-btn-size" type="button">한국어</button>
    <button id="btn-lang-en" class="btn-primary plaque-btn plaque-btn-size" type="button">English</button>
  </div>
</section>

<div id="app">

  <section id="screen-onboarding" class="screen screen-onboarding active">
    <div class="door-stage">
      <img id="door" class="door-bg pixelated" alt="마법사의 방으로 통하는 문" />
      <img id="door-void" class="door-void pixelated" alt="" aria-hidden="true" />
      <img id="door-leaf" class="door-leaf pixelated" alt="" aria-hidden="true" />
      <div class="door-sparkles" aria-hidden="true">
        <span class="sparkle sparkle-lg" style="--sx: 18.14%; --sy: 5.75%; --sd: 0s"></span>
        <span class="sparkle sparkle-lg" style="--sx: 59.13%; --sy: 3.68%; --sd: 0.7s"></span>
        <span class="sparkle sparkle-md" style="--sx: 49.29%; --sy: 36.13%; --sd: 1.4s"></span>
        <span class="sparkle sparkle-sm" style="--sx: 81.64%; --sy: 22.55%; --sd: 0.35s"></span>
        <span class="sparkle sparkle-sm" style="--sx: 32.46%; --sy: 59.61%; --sd: 1.05s"></span>
      </div>
      <div class="door-cta">
        <button id="btn-enter" class="btn-primary plaque-btn plaque-btn-size door-enter-btn" type="button">
          들어가기
        </button>
      </div>
    </div>

    <div
      id="onboarding-dialog-box"
      class="dialog-box"
      role="button"
      tabindex="0"
      aria-label="건너뛰기"
    >
      <p id="onboarding-dialog-text" class="dialog-text"></p>
      <p id="onboarding-privacy-notice" class="onboarding-privacy-notice">당신이 쓴 이야기는 어디에도 저장되지 않으며, 화면을 벗어나는 순간 사라집니다.</p>
    </div>
  </section>

  <section id="screen-room" class="screen">
    <div class="room-stage">
      <img id="img-room" class="room-bg pixelated" alt="마법사의 방" />
      <div class="room-sparkles" aria-hidden="true">
        <span class="sparkle sparkle-gold sparkle-lg" style="--sx: 59.3%; --sy: 3.2%; --sd: 0.2s"></span>
        <span class="sparkle sparkle-gold sparkle-md" style="--sx: 33.8%; --sy: 5.5%; --sd: 1.1s"></span>
        <span class="sparkle sparkle-pink sparkle-md" style="--sx: 62.0%; --sy: 14.0%; --sd: 0.6s"></span>
        <span class="sparkle sparkle-gold sparkle-sm" style="--sx: 34.6%; --sy: 35.4%; --sd: 1.6s"></span>
        <span class="sparkle sparkle-gold sparkle-sm" style="--sx: 43.2%; --sy: 45.6%; --sd: 0.85s"></span>
        <span class="sparkle sparkle-pink sparkle-sm" style="--sx: 88.4%; --sy: 55.2%; --sd: 1.35s"></span>
      </div>
      <div class="room-lamp-glow" style="--gx: 48.5%; --gy: 56.7%; --gd: 0s" aria-hidden="true"></div>
      <div class="room-lamp-glow" style="--gx: 73.2%; --gy: 87.5%; --gd: 1.1s" aria-hidden="true"></div>
      <div class="room-window-glow is-moon" style="--gx: 87.9%; --gy: 15.0%; --gd: 0.6s" aria-hidden="true"></div>
      <div class="room-window-glow is-pink" style="--gx: 75.8%; --gy: 54.4%; --gd: 1.9s" aria-hidden="true"></div>
      <div class="cat-eyes" aria-hidden="true">
        <span class="cat-eye-mask" style="--ex: 13.44%; --ey: 88.55%"></span>
        <span class="cat-eye-mask" style="--ex: 16.24%; --ey: 88.50%"></span>
        <span class="cat-eye-pupil" style="--ex: 13.44%; --ey: 88.55%"></span>
        <span class="cat-eye-pupil" style="--ex: 16.24%; --ey: 88.50%"></span>
      </div>
      <img id="img-wizard" class="room-character pixelated" alt="마법사 캐릭터" />
      <img id="img-cauldron" class="room-bg cauldron-bg pixelated" alt="보글보글 끓는 냄비" aria-hidden="true" />
      <div class="cauldron-glow-fx" aria-hidden="true">
        <span class="sparkle sparkle-violet sparkle-md" style="--sx: 55.1%; --sy: 54.3%; --sd: 0s"></span>
        <span class="sparkle sparkle-violet sparkle-sm" style="--sx: 39.2%; --sy: 52.4%; --sd: 0.5s"></span>
        <span class="sparkle sparkle-violet sparkle-lg" style="--sx: 51.7%; --sy: 64.2%; --sd: 1s"></span>
        <span class="sparkle sparkle-violet sparkle-sm" style="--sx: 59.3%; --sy: 46.1%; --sd: 1.4s"></span>
        <span class="sparkle sparkle-violet sparkle-md" style="--sx: 49.2%; --sy: 36.1%; --sd: 0.3s"></span>
        <span class="sparkle sparkle-violet sparkle-sm" style="--sx: 53.4%; --sy: 41.5%; --sd: 0.9s"></span>
        <span class="sparkle sparkle-violet sparkle-md" style="--sx: 41.7%; --sy: 64.2%; --sd: 1.7s"></span>
        <span class="room-lamp-glow cauldron-candle-glow" style="--gx: 26.8%; --gy: 67%; --gd: 0s"></span>
        <span class="room-lamp-glow cauldron-candle-glow" style="--gx: 79.7%; --gy: 74.2%; --gd: 0.8s"></span>
        <span class="room-lamp-glow cauldron-candle-glow" style="--gx: 86.1%; --gy: 77.3%; --gd: 1.4s"></span>
      </div>
      <svg
        id="cauldron-target-outline"
        class="cauldron-target-outline"
        viewBox="0 0 100 100"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <path
          class="cauldron-target-outline-path"
          d="M 37,65
             L 43,61 L 50,60 L 57,61 L 63,65
             L 68,71 L 70,75
             L 68,80 L 66,86 L 60,90
             L 52,92 L 48,92 L 40,90
             L 34,86 L 32,80
             L 30,75
             L 32,71 Z"
        />
      </svg>
      <img
        id="img-drag-memo"
        class="drag-memo pixelated"
        alt="구겨진 메모지. 드래그해서 냄비에 넣으세요."
        draggable="false"
      />
      <div id="destroy-flash" class="destroy-flash" aria-hidden="true"></div>
      <canvas id="room-particle-canvas" class="room-particle-canvas" aria-hidden="true"></canvas>
    </div>

    <div
      id="dialog-box"
      class="dialog-box"
      role="button"
      tabindex="0"
      aria-label="다음"
    >
      <p id="dialog-text" class="dialog-text"><span id="dialog-text-content"></span><span id="dialog-next-hint" class="dialog-next-hint" aria-hidden="true" hidden>→</span></p>
    </div>

  </section>

  <section id="screen-destroy" class="screen">
    <div id="destroy-text-wrap" class="destroy-text-wrap">
      <p id="destroy-text-top" class="destroy-text-half destroy-text-top"></p>
      <p id="destroy-text-bottom" class="destroy-text-half destroy-text-bottom"></p>
    </div>
    <canvas id="particle-canvas"></canvas>
  </section>

  <section id="screen-result" class="screen">
    <div class="result-window">
      <p id="result-message" class="result-message"></p>
    </div>
    <div class="result-panel">
      <button id="btn-restart" class="btn-primary plaque-btn plaque-btn-size" type="button">다른 이야기</button>
    </div>
  </section>

  <div class="app-frame" aria-hidden="true"></div>
  <div id="scene-veil" class="scene-veil" aria-hidden="true"></div>

  <!-- 테두리(app-frame) 그림에 이미 그려진 왼쪽 아래 책 장식 위에, 보이지
       않는 클릭 영역만 얹어서 설정 버튼으로 쓴다(실측 좌표: --book-*).
       호버하면 클릭 가능하다는 걸 알 수 있도록 은은한 테두리가 뜬다. -->
  <button id="btn-settings" class="btn-settings-book" type="button" aria-label="설정"></button>
  <p id="settings-book-label" class="settings-book-label" aria-hidden="true">설정</p>

  <!-- 테두리 그림 오른쪽 아래에 그려진 물약 장식 위에, 같은 방식으로 보이지
       않는 클릭 영역만 얹어서 의견 보내기 창구로 쓴다(실측 좌표: --potion-*).
       설정 안의 의견 보내기와 링크가 같고, 설정 버튼처럼 모든 화면에서 보인다. -->
  <a
    id="btn-feedback-potion"
    class="btn-feedback-potion"
    href="https://forms.gle/bE4NDXQmnFGEwSrW9"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="의견 보내기"
  ></a>
  <p id="feedback-potion-label" class="feedback-potion-label" aria-hidden="true">피드백</p>

  <!-- 책과 물약 사이 빈 공간에 방문/이야기 횟수를 실시간으로 보여준다.
       localStorage에 저장해서 새로고침해도 유지된다(걱정 내용 자체는
       여전히 어디에도 저장하지 않는다 — 이건 단순 횟수 집계일 뿐). -->
  <div id="visit-stats" class="visit-stats" aria-hidden="true">
    <span id="stat-today" class="visit-stat"></span>
    <span id="stat-total" class="visit-stat"></span>
    <span id="stat-stories" class="visit-stat"></span>
  </div>

  <button id="btn-dialog-skip" class="dialog-skip-btn" type="button">Skip</button>

</div>

<div id="settings-overlay" class="settings-overlay hidden">
  <div class="settings-panel">
    <img id="settings-panel-bg" class="settings-panel-bg" alt="" aria-hidden="true" draggable="false" />
    <button id="btn-settings-close" class="settings-close" type="button" aria-label="닫기"></button>
    <p id="settings-title" class="settings-title">설정</p>

    <div class="settings-body">
      <div id="lang-toggle" class="lang-toggle is-ko" role="group">
        <span class="lang-toggle-thumb" aria-hidden="true"></span>
        <button id="btn-settings-lang-ko" class="lang-toggle-option is-active" type="button">한국어</button>
        <button id="btn-settings-lang-en" class="lang-toggle-option" type="button">English</button>
      </div>

      <div class="sound-toggles-row">
        <div class="sound-toggle-item">
          <span id="settings-mute-sfx-label" class="sound-toggle-label">효과음</span>
          <button id="btn-mute-sfx" class="sound-toggle is-on" type="button" aria-pressed="true">
            <span class="sound-toggle-on-text">ON</span>
            <span class="sound-toggle-off-text">OFF</span>
            <span class="sound-toggle-knob" aria-hidden="true"></span>
          </button>
        </div>

        <div class="sound-toggle-item">
          <span id="settings-mute-bgm-label" class="sound-toggle-label">배경음</span>
          <button id="btn-mute-bgm" class="sound-toggle is-on" type="button" aria-pressed="true">
            <span class="sound-toggle-on-text">ON</span>
            <span class="sound-toggle-off-text">OFF</span>
            <span class="sound-toggle-knob" aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <a
        id="btn-feedback"
        class="settings-feedback-btn"
        href="https://forms.gle/bE4NDXQmnFGEwSrW9"
        target="_blank"
        rel="noopener noreferrer"
      >의견 보내기</a>
    </div>
  </div>
</div>

<!-- 종이는 유일하게 테두리(#app)를 벗어나 화면에 그대로 걸쳐 보여야 해서,
     #app 밖(overflow:hidden의 영향을 받지 않는 자리)에 별도로 둔다. -->
<div id="memo-overlay" class="memo-overlay">
  <div id="memo-stage" class="memo-stage">
    <img id="img-memo" class="memo-bg pixelated" alt="빈 종이" aria-hidden="true" />

    <div id="input-area" class="input-area memo-writable" hidden>
      <textarea
        id="input-text"
        class="input-text memo-textarea"
        placeholder="힘들게 했던 일들을 적어보세요. 무슨 일이 일어날 지도..?"
        rows="8"
      ></textarea>
      <p id="input-error" class="input-error" role="alert" hidden>
        내용을 입력해주세요.
      </p>
      <button id="btn-submit" class="btn-primary plaque-btn plaque-btn-size" type="button" disabled>전달하기</button>
      <p id="submit-notice" class="submit-notice">작성된 내용은 어디에도 저장되지 않습니다.</p>
    </div>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
